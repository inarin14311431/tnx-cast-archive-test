  <g font-family="monospace" letter-spacing="7">
    <text x="86" y="105" fill="#ffbd36" font-size="24">RESTRICTED AREA // CASE LOCK</text>
    <text x="90" y="139" fill="#8fa2aa" font-size="14" letter-spacing="4">ACCESS DENIED · MUNICIPAL SECURITY LINE</text>
    <text x="1260" y="830" text-anchor="end" fill="#ff5b42" font-size="18">BLOCKADE 07</text>
  </g>
</svg>
