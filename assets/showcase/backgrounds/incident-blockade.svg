<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">封鎖区域</title>
  <desc id="desc">規制ラインと蒸気が漂う事件直後の封鎖都市街路</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071017"/>
      <stop offset="0.58" stop-color="#14202a"/>
      <stop offset="1" stop-color="#020507"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#11171b"/>
      <stop offset="0.5" stop-color="#24292b"/>
      <stop offset="1" stop-color="#101518"/>
    </linearGradient>
    <linearGradient id="warning" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb100"/>
      <stop offset="0.5" stop-color="#ffe05c"/>
      <stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
    <radialGradient id="mist" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d9eff2" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#d9eff2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stripe" width="72" height="72" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="36" height="72" fill="#171a1d"/>
      <rect x="36" width="36" height="72" fill="#f2b821"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1240" cy="150" r="180" fill="url(#mist)"/>
  <circle cx="340" cy="300" r="240" fill="url(#mist)"/>

  <g opacity="0.92">
