    <path d="M48 140h92v16H48zm252 84h102v13H300zm281-94h132v14H581zm327 126h80v12h-80zm252-90h128v15h-128z" fill="#293942" opacity="0.7"/>
    <g fill="#e54b32" opacity="0.6">
      <rect x="83" y="205" width="9" height="18"/><rect x="127" y="252" width="9" height="18"/>
      <rect x="338" y="281" width="9" height="17"/><rect x="650" y="190" width="10" height="21"/>
      <rect x="956" y="305" width="9" height="19"/><rect x="1228" y="228" width="10" height="20"/>
    </g>
  </g>

  <path d="M0 554L1600 472V900H0z" fill="url(#road)"/>
  <path d="M0 650L1600 555" stroke="#6d777b" stroke-width="4" opacity="0.45"/>
  <path d="M0 782L1600 674" stroke="#30383b" stroke-width="22" opacity="0.7"/>
  <path d="M680 900L822 506" stroke="#d4b44a" stroke-width="10" stroke-dasharray="62 52" opacity="0.58"/>
  <path d="M1010 900L941 500" stroke="#d4b44a" stroke-width="10" stroke-dasharray="62 52" opacity="0.58"/>

  <g opacity="0.55" fill="none" stroke="#8bb2bb">
    <path d="M112 470c85-82 130-34 207-118" stroke-width="7"/>
    <path d="M1284 399c-71-92-123-41-179-131" stroke-width="5"/>
  </g>

  <g filter="url(#glow)">
    <rect x="0" y="510" width="1600" height="13" fill="#ff462e" opacity="0.3"/>
    <rect x="0" y="518" width="1600" height="3" fill="#ff856f" opacity="0.8"/>
  </g>

  <g transform="translate(0 35)">
