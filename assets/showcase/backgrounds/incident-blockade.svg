    <path d="M-90 510L1690 420" stroke="url(#stripe)" stroke-width="64"/>
    <path d="M-90 510L1690 420" stroke="#fff4c8" stroke-width="3" opacity="0.6"/>
  </g>

  <g fill="#15191c" stroke="#68737a" stroke-width="5">
    <path d="M154 482h38l18 232h-75z"/><path d="M1403 416h38l43 228h-76z"/>
    <path d="M455 467h28l20 139h-60z"/><path d="M1142 432h28l28 139h-60z"/>
  </g>
  <g fill="url(#warning)" filter="url(#glow)">
    <rect x="141" y="470" width="64" height="13" rx="5"/>
    <rect x="1394" y="405" width="64" height="13" rx="5"/>
    <rect x="442" y="456" width="54" height="10" rx="5"/>
    <rect x="1129" y="421" width="54" height="10" rx="5"/>
