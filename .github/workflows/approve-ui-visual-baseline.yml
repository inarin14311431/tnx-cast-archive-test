name: Approve cross-screen visual baseline

on:
  push:
    branches: [ui/cross-screen-polish-20260905]
    paths: [.github/workflows/approve-ui-visual-baseline.yml]

permissions:
  contents: write

jobs:
  approve:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 20
    steps:
      - name: Checkout feature
        uses: actions/checkout@v7
      - name: Checkout visual baseline
        uses: actions/checkout@v7
        with:
          repository: inarin14311431/tnx-cast-archive-test
          ref: visual-regression-baseline
          path: .visual-reference
      - name: Sync visual test contract
        run: |
          rm -rf tests/visual
          cp -R .visual-reference/tests/visual tests/visual
          cp .visual-reference/playwright.visual.config.js playwright.visual.config.js
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Regenerate reviewed desktop snapshots
        run: npx playwright test --config=playwright.visual.config.js --project=visual-desktop --grep-invert 'キャスト閲覧 spectrum-neon' --update-snapshots
      - name: Regenerate reviewed mobile snapshots
        run: npx playwright test --config=playwright.visual.config.js --project=visual-mobile --update-snapshots
      - name: Commit approved baseline changes
        run: |
          rm -rf .visual-reference/tests/visual/__screenshots__
          cp -R tests/visual/__screenshots__ .visual-reference/tests/visual/
          cd .visual-reference
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/visual/__screenshots__
          git diff --cached --quiet && exit 0
          git commit -m 'Approve cross-screen UI polish baseline'
          git push origin HEAD:visual-regression-baseline
