name: Apply showcase theme prototype
on:
  push:
    branches:
      - feat/showcase-theme-prototype
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/showcase-theme-prototype
      - name: Patch showcase theme integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f"pattern not found in {path}: {old[:100]!r}")
              text = text.replace(old, new, count)
              p.write_text(text)

          # Generator UI: four-theme selector. Default remains the current N◎VA presentation.
          patch("showcase-generator.html",
                '<label>アクト名／サブタイトル<input id="act-name" type="text" value="トーキョーＮ◎ＶＡ アクト参加キャスト"></label>\n        <label>RULER名',
                '<label>アクト名／サブタイトル<input id="act-name" type="text" value="トーキョーＮ◎ＶＡ アクト参加キャスト"></label>\n        <label>紹介テーマ <small>SHOWCASE THEME</small><select id="showcase-theme"><option value="nova" selected>トーキョーＮ◎ＶＡ</option><option value="intron">イントロン</option><option value="vlad">ヴラド・コロニー</option><option value="lutetia">ヴィル・ヌーヴ・ルテチア</option></select><small>生成HTML・従来版・豪華版に共通で適用します。</small></label>\n        <label>RULER名')
          patch("showcase-generator.html", 'showcase-generator-loader.js?v=29', 'showcase-generator-loader.js?v=30')

          # Generator core: keep generated/downloaded HTML themed as well as dynamic publishing.
          patch("js/showcase-generator-v3.js",
                '  actName: document.querySelector("#act-name"),\n  rulerName:',
                '  actName: document.querySelector("#act-name"),\n  showcaseTheme: document.querySelector("#showcase-theme"),\n  rulerName:')
          patch("js/showcase-generator-v3.js",
                '  elements.backgroundFile?.addEventListener("change", () => invalidateGeneratedHtml("背景画像が変更されました。HTMLを再生成してください。"));',
                '  elements.showcaseTheme?.addEventListener("change", () => invalidateGeneratedHtml("紹介テーマが変更されました。HTMLを再生成してください。"));\n  elements.backgroundFile?.addEventListener("change", () => invalidateGeneratedHtml("背景画像が変更されました。HTMLを再生成してください。"));')
          patch("js/showcase-generator-v3.js",
                '      rulerName: elements.rulerName?.value.trim() || "",\n      intro:',
                '      rulerName: elements.rulerName?.value.trim() || "",\n      theme: normalizeShowcaseTheme(elements.showcaseTheme?.value),\n      intro:')
          patch("js/showcase-generator-v3.js",
                '<html lang="ja">',
                '<html lang="ja" data-showcase-theme="${escapeAttribute(normalizeShowcaseTheme(data.theme))}">')
          patch("js/showcase-generator-v3.js",
                '<style>${createOutputCss(backgroundStyle)}</style>',
                '<style>${createOutputCss(backgroundStyle, data.theme)}</style>')
          old_css = '''function createOutputCss(backgroundStyle) {\n  return `\n:root{--cyan:#00efff;--pink:#ff54b5;--green:#61ffb1;--text:#edfbff;--muted:#89afb9}\n*{box-sizing:border-box}html{scroll-behavior:smooth}\nbody{margin:0;min-height:100vh;color:var(--text);font-family:\"Noto Sans JP\",\"Yu Gothic\",sans-serif;background-color:#02080c;${backgroundStyle}background-size:cover;background-position:center top;background-attachment:fixed}'''
          new_css = '''function normalizeShowcaseTheme(value) {\n  const theme = String(value || \"\").trim().toLowerCase();\n  return [\"nova\", \"intron\", \"vlad\", \"lutetia\"].includes(theme) ? theme : \"nova\";\n}\n\nfunction getOutputThemeVariables(value) {\n  const palettes = {\n    nova: [\"#02080c\", \"#00efff\", \"#ff54b5\", \"#61ffb1\", \"#edfbff\", \"#89afb9\", \"1,9,14\"],\n    intron: [\"#f2f2f0\", \"#111111\", \"#9b3268\", \"#236b49\", \"#111111\", \"#5f5f5b\", \"255,255,255\"],\n    vlad: [\"#020202\", \"#ff4d62\", \"#ff6b7c\", \"#d8a4aa\", \"#f7eeee\", \"#b89b9f\", \"22,7,10\"],\n    lutetia: [\"#050c18\", \"#6ea1ff\", \"#b79cff\", \"#8fd7ff\", \"#eef6ff\", \"#9bb1cc\", \"13,28,49\"]\n  };\n  const [bg, cyan, pink, green, text, muted, panelRgb] = palettes[normalizeShowcaseTheme(value)];\n  return `:root{--showcase-bg:${bg};--cyan:${cyan};--pink:${pink};--green:${green};--text:${text};--muted:${muted};--panel:rgba(${panelRgb},.92)}`;\n}\n\nfunction createOutputCss(backgroundStyle, theme) {\n  return `\n${getOutputThemeVariables(theme)}\n*{box-sizing:border-box}html{scroll-behavior:smooth}\nbody{margin:0;min-height:100vh;color:var(--text);font-family:\"Noto Sans JP\",\"Yu Gothic\",sans-serif;background-color:var(--showcase-bg);${backgroundStyle}background-size:cover;background-position:center top;background-attachment:fixed}'''
          patch("js/showcase-generator-v3.js", old_css, new_css)

          # Publish theme inside existing showcase_data JSONB; no DB schema change.
          patch("js/showcase-dynamic-publish-v3.js",
                'const actNameField = document.querySelector("#act-name");\nconst rulerField',
                'const actNameField = document.querySelector("#act-name");\nconst showcaseThemeField = document.querySelector("#showcase-theme");\nconst rulerField')
          patch("js/showcase-dynamic-publish-v3.js",
                '    showcaseData.scenarioWriterName = scenarioWriterName;\n\n    const payloadBytes',
                '    showcaseData.scenarioWriterName = scenarioWriterName;\n    showcaseData.theme = normalizeShowcaseTheme(showcaseThemeField?.value);\n\n    const payloadBytes')
          patch("js/showcase-dynamic-publish-v3.js",
                '? `./act-showcase-standard.html?id=${encodeURIComponent(slug)}`\n      : `./act-showcase.html?id=${encodeURIComponent(slug)}`;',
                '? `./act-showcase-standard.html?id=${encodeURIComponent(slug)}&theme=${encodeURIComponent(showcaseData.theme)}`\n      : `./act-showcase.html?id=${encodeURIComponent(slug)}&theme=${encodeURIComponent(showcaseData.theme)}`;')
          patch("js/showcase-dynamic-publish-v3.js",
                'function normalizeSlug(value) {',
                'function normalizeShowcaseTheme(value) {\n  const theme = String(value || "").trim().toLowerCase();\n  return ["nova", "intron", "vlad", "lutetia"].includes(theme) ? theme : "nova";\n}\n\nfunction normalizeSlug(value) {')

          # Editing an already-published showcase restores its saved theme.
          patch("js/showcase-edit-restore.js",
                '  actName: document.querySelector("#act-name"),\n  rulerName:',
                '  actName: document.querySelector("#act-name"),\n  showcaseTheme: document.querySelector("#showcase-theme"),\n  rulerName:')
          patch("js/showcase-edit-restore.js",
                '  setField(elements.actName, showcase.actName || data?.actName || slug);\n  setField(elements.rulerName',
                '  setField(elements.actName, showcase.actName || data?.actName || slug);\n  setField(elements.showcaseTheme, ["nova", "intron", "vlad", "lutetia"].includes(showcase.theme) ? showcase.theme : "nova");\n  elements.showcaseTheme?.dispatchEvent(new Event("change", { bubbles: true }));\n  setField(elements.rulerName')

          # Public cinematic page: apply query theme before paint, then saved theme after loading data.
          patch("act-showcase.html",
                '<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;500;700;900&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">\n  <link rel="stylesheet" href="./css-next/pages/act-showcase-entry.css?v=8">',
                '<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;500;700;900&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">\n  <script src="./js/act-showcase-theme-runtime.js?v=1"></script>\n  <link rel="stylesheet" href="./css-next/pages/act-showcase-entry.css?v=9">')
          patch("act-showcase.html", 'act-showcase-bootstrap.js?v=11', 'act-showcase-bootstrap.js?v=12')
          patch("css-next/pages/act-showcase-entry.css",
                '@import "./act-showcase-handout-live-frame.css?v=1";',
                '@import "./act-showcase-handout-live-frame.css?v=1";\n@import "./act-showcase-theme.css?v=1";')
          patch("js/act-showcase-bootstrap.js",
                'act-showcase-page.js?v=20260910a',
                'act-showcase-page.js?v=20260915a')
          patch("js/act-showcase-page.js",
                '    const data = await loadPublicShowcase(slug);\n    const model',
                '    const data = await loadPublicShowcase(slug);\n    globalThis.TNX_SHOWCASE_THEME?.applySaved(data?.theme);\n    const model')

          # Standard public page uses the same theme runtime/layer.
          patch("act-showcase-standard.html",
                '<link rel="stylesheet" href="./css-next/pages/act-showcase-standard-hotfix.css?v=1">',
                '<link rel="stylesheet" href="./css-next/pages/act-showcase-standard-hotfix.css?v=1">\n  <script src="./js/act-showcase-theme-runtime.js?v=1"></script>\n  <link rel="stylesheet" href="./css-next/pages/act-showcase-theme.css?v=1">')
          patch("act-showcase-standard.html", 'act-showcase-standard.js?v=2', 'act-showcase-standard.js?v=3')
          patch("js/act-showcase-standard.js",
                '    const data = await loadPublicShowcase(slug);\n    if (!data',
                '    const data = await loadPublicShowcase(slug);\n    globalThis.TNX_SHOWCASE_THEME?.applySaved(data?.theme);\n    if (!data')
          patch("js/act-showcase-standard.js",
                'document.body.style.backgroundImage = `linear-gradient(rgba(2,8,12,.58),rgba(2,8,12,.92)),url("${escapeCssString(background)}")`;',
                'document.body.style.backgroundImage = `linear-gradient(rgba(var(--showcase-bg-rgb,2,8,12),.58),rgba(var(--showcase-bg-rgb,2,8,12),.92)),url("${escapeCssString(background)}")`;')

          # Loader cache versions for the modified generator modules.
          patch("js/showcase-generator-loader.js", 'showcase-generator-v3.js?v=8', 'showcase-generator-v3.js?v=9')
          patch("js/showcase-generator-loader.js", 'showcase-dynamic-publish-v3.js?v=2', 'showcase-dynamic-publish-v3.js?v=3')
          patch("js/showcase-generator-loader.js", 'showcase-edit-restore.js?v=1', 'showcase-edit-restore.js?v=2')
          PY
      - name: Verify integration markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="showcase-theme"' showcase-generator.html
          grep -q 'showcaseData.theme = normalizeShowcaseTheme' js/showcase-dynamic-publish-v3.js
          grep -q 'TNX_SHOWCASE_THEME?.applySaved' js/act-showcase-page.js
          grep -q 'act-showcase-theme.css?v=1' css-next/pages/act-showcase-entry.css
          grep -q 'data-showcase-theme' js/showcase-generator-v3.js
      - name: Commit patched files
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add showcase-generator.html act-showcase.html act-showcase-standard.html css-next/pages/act-showcase-entry.css js/showcase-generator-v3.js js/showcase-dynamic-publish-v3.js js/showcase-edit-restore.js js/act-showcase-bootstrap.js js/act-showcase-page.js js/act-showcase-standard.js js/showcase-generator-loader.js
          git commit -m 'アクト紹介4テーマの選択と公開反映を実装'
          git push origin HEAD:feat/showcase-theme-prototype
