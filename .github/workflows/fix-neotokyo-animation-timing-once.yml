name: Fix NeoTokyo Animation Timing Once

on:
  push:
    branches:
      - fix/neotokyo-animation-timing

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Align NeoTokyo phase timing with CSS motion
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('js/act-showcase-neotokyo.js')
          s = p.read_text()
          replacements = {
              '  await wait(state, 900);\n': '  await wait(state, 2900);\n',
              '  await wait(state, 1500);\n': '  await wait(state, 1900);\n',
              '  await wait(state, 420);\n': '  await wait(state, 780);\n',
              '  await wait(state, 620);\n': '  await wait(state, 850);\n',
              '  await wait(state, 360);\n': '  await wait(state, 560);\n',
              '  await wait(state, 520);\n': '  await wait(state, 700);\n',
          }
          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected one occurrence of {old!r}, found {count}')
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('js/act-showcase-page.js')
          s = p.read_text()
          old = 'import { prepareNeoTokyoLoading, runNeoTokyoIntro } from "./act-showcase-neotokyo.js?v=1";'
          new = 'import { prepareNeoTokyoLoading, runNeoTokyoIntro } from "./act-showcase-neotokyo.js?v=2";'
          if s.count(old) != 1:
              raise SystemExit('NeoTokyo import cache key not found exactly once')
          p.write_text(s.replace(old, new, 1))

          p = Path('act-showcase.html')
          s = p.read_text()
          old = './js/act-showcase-page.js?v=20260907g'
          new = './js/act-showcase-page.js?v=20260907h'
          if s.count(old) != 1:
              raise SystemExit('showcase page cache key not found exactly once')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Add regression contract
        run: |
          cat > tests/act-showcase-animation-timing.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const sequence = fs.readFileSync('js/act-showcase-neotokyo.js', 'utf8');
          const page = fs.readFileSync('js/act-showcase-page.js', 'utf8');
          const html = fs.readFileSync('act-showcase.html', 'utf8');

          test('NeoTokyo automatic cinematic phases are not cut off before their CSS motion completes', () => {
            assert.match(sequence, /await wait\(state, 2900\);/);
            assert.match(sequence, /await wait\(state, 1900\);/);
          });

          test('HANDOUT to ASSIGN linkage keeps split, search, found and cast reveal visible long enough', () => {
            assert.match(sequence, /await wait\(state, 780\);/);
            assert.match(sequence, /await wait\(state, 850\);/);
            assert.match(sequence, /await wait\(state, 560\);/);
            assert.match(sequence, /await wait\(state, 700\);/);
          });

          test('NeoTokyo timing fix is cache-busted through the module chain', () => {
            assert.match(page, /act-showcase-neotokyo\.js\?v=2/);
            assert.match(html, /act-showcase-page\.js\?v=20260907h/);
          });
          EOF

      - name: Remove one-shot workflow and commit repair
        run: |
          rm .github/workflows/fix-neotokyo-animation-timing-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/act-showcase-neotokyo.js js/act-showcase-page.js act-showcase.html tests/act-showcase-animation-timing.test.mjs
          git add -u .github/workflows/fix-neotokyo-animation-timing-once.yml
          git commit -m 'Restore NeoTokyo intermediate animation timing'
          git push origin HEAD:fix/neotokyo-animation-timing
