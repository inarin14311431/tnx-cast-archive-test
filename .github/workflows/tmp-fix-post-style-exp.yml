name: Temporary POST style exp repair

on:
  push:
    branches: [fix/post-transfer-style-exp]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-transfer-style-exp
      - name: Patch POST style skill experience mapping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/tnx-direct-transfer-data.js')
          s = p.read_text()
          marker = 'function toStyleSkill(skill) {\n'
          helper = '''function styleSkillExpBase(skill) {\n  const kind = text(skill?.skill_kind).toLowerCase();\n  if (kind === "secret" || kind === "秘技") return "20";\n  if (kind === "ultimate" || kind === "奥義") return "50";\n  if (["direction", "none", "演出", "なし"].includes(kind)) return "0";\n  return "10";\n}\n'''
          if 'function styleSkillExpBase(skill)' not in s:
              if marker not in s:
                  raise SystemExit('toStyleSkill marker not found')
              s = s.replace(marker, helper + marker, 1)
          old = '    expbase: "10", h: flag(skill.life), level: text(skill.level) || null, limit: nullable(detail.limit),'
          new = '    expbase: styleSkillExpBase(skill), h: flag(skill.life), level: text(skill.level) || null, limit: nullable(detail.limit),'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('expbase mapping target not found')
          p.write_text(s)
          PY

          cat > tests/post-transfer-style-exp-contract.test.mjs <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";

          const read = path => readFile(new URL(`../${path}`, import.meta.url), "utf8");

          test("POST transfer maps style skill experience base by skill kind", async () => {
            const source = await read("js/tnx-direct-transfer-data.js");
            assert.match(source, /function styleSkillExpBase\(skill\)/);
            assert.match(source, /kind === "secret" \|\| kind === "秘技"\) return "20"/);
            assert.match(source, /kind === "ultimate" \|\| kind === "奥義"\) return "50"/);
            assert.match(source, /\["direction", "none", "演出", "なし"\]\.includes\(kind\)\) return "0"/);
            assert.match(source, /expbase: styleSkillExpBase\(skill\)/);
          });
          EOF

          rm .github/workflows/tmp-fix-post-style-exp.yml
      - name: Commit repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- js/tnx-direct-transfer-data.js tests/post-transfer-style-exp-contract.test.mjs .github/workflows/tmp-fix-post-style-exp.yml
          git commit -m "Fix POST style skill experience mapping"
          git push origin HEAD:fix/post-transfer-style-exp
