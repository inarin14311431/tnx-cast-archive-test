name: Update mobile style visual baseline

on:
  pull_request:

permissions:
  contents: write

jobs:
  update-baseline:
    if: github.head_ref == 'fix/mobile-style-divine-layout'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
      - name: Checkout approved visual reference
        uses: actions/checkout@v7
        with:
          repository: inarin14311431/tnx-cast-archive-test
          ref: visual-regression-baseline
          path: .visual-reference
      - name: Sync visual contract and snapshots
        run: |
          rm -rf tests/visual
          cp -R .visual-reference/tests/visual tests/visual
          cp .visual-reference/playwright.visual.config.js playwright.visual.config.js
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Regenerate only mobile cast baselines
        run: npx playwright test --config=playwright.visual.config.js --project=visual-mobile --grep 'キャスト閲覧' --update-snapshots=all
      - name: Copy approved candidate images
        run: |
          cp tests/visual/__screenshots__/visual-mobile/core-pages.visual.spec.js/cast-nova-visual-mobile.png .visual-reference/tests/visual/__screenshots__/visual-mobile/core-pages.visual.spec.js/cast-nova-visual-mobile.png
          cp tests/visual/__screenshots__/visual-mobile/core-pages.visual.spec.js/cast-spectrum-neon-visual-mobile.png .visual-reference/tests/visual/__screenshots__/visual-mobile/core-pages.visual.spec.js/cast-spectrum-neon-visual-mobile.png
      - name: Verify baseline scope
        working-directory: .visual-reference
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'tests/visual/__screenshots__/visual-mobile/core-pages.visual.spec.js/cast-nova-visual-mobile.png'
          test "${changed[1]}" = 'tests/visual/__screenshots__/visual-mobile/core-pages.visual.spec.js/cast-spectrum-neon-visual-mobile.png'
      - name: Commit approved mobile cast baselines
        working-directory: .visual-reference
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/visual/__screenshots__/visual-mobile/core-pages.visual.spec.js/cast-nova-visual-mobile.png tests/visual/__screenshots__/visual-mobile/core-pages.visual.spec.js/cast-spectrum-neon-visual-mobile.png
          git commit -m 'スタイル・神業配置をビジュアル基準へ反映'
          git push origin HEAD:visual-regression-baseline
