name: Fix outfit import duplicate rows
on:
  push:
    paths:
      - '.github/workflows/fix-outfit-import-duplicates.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch importer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('js/sheet-import-outfit-compat.js')
          s=p.read_text()
          s=re.sub(r'\n  async function createFallbackRow\(item\)\{.*?\n  \}\n\n  function rowCategory', '''\n  async function findExistingRow(item,used,timeout=8000){
    const started=Date.now();
    while(Date.now()-started<timeout){
      const rows=[...document.querySelectorAll(`${ROOT} [data-outfit-key]`)];
      let row=rows.find(candidate=>!used.has(candidate.dataset.outfitKey)&&rowName(candidate)===item.name&&rowCategory(candidate)===item.category);
      if(!row&&["cyberware","tron"].includes(item.category))row=rows.find(candidate=>!used.has(candidate.dataset.outfitKey)&&rowName(candidate)===item.name&&rowCategory(candidate)==="other");
      if(!row)row=rows.find(candidate=>!used.has(candidate.dataset.outfitKey)&&rowName(candidate)===item.name);
      if(row)return row;
      await frame();
    }
    return null;
  }

  function rowCategory''',s,flags=re.S)
          old='''  async function convertAll(items){
    const rows=[...document.querySelectorAll(`${ROOT} [data-outfit-key]`)];
    const used=new Set();'''
          new='''  async function convertAll(items){
    const used=new Set();'''
          if old not in s: raise SystemExit('convertAll header not found')
          s=s.replace(old,new,1)
          s=re.sub(r'''      let row=rows\.find\(candidate=>!used\.has\(candidate\.dataset\.outfitKey\)&&rowName\(candidate\)===item\.name&&rowCategory\(candidate\)===item\.category\);\n      if\(!row&&\["cyberware","tron"\]\.includes\(item\.category\)\)row=rows\.find\(candidate=>!used\.has\(candidate\.dataset\.outfitKey\)&&rowName\(candidate\)===item\.name&&rowCategory\(candidate\)==="other"\);\n      if\(!row\)\{\n        progress\(step\(index,\.25\),"アウトフィット行を再生成中",`\$\{index\+1\}/\$\{items\.length\}件　\$\{item\.name\}`\);\n        row=await createFallbackRow\(item\);\n        if\(row\)rows\.push\(row\);\n      \}''','''      const row=await findExistingRow(item,used);
      if(!row)progress(step(index,.25),"アウトフィット行を再検索中",`${index+1}/${items.length}件　${item.name}`);''',s)
          if 'createFallbackRow' in s: raise SystemExit('fallback function still present')
          p.write_text(s)
          h=Path('sheet.html')
          t=h.read_text().replace('sheet-import-outfit-compat.js?v=9','sheet-import-outfit-compat.js?v=10')
          h.write_text(t)
          PY
          node --check js/sheet-import-outfit-compat.js
          rm .github/workflows/fix-outfit-import-duplicates.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/sheet-import-outfit-compat.js sheet.html .github/workflows/fix-outfit-import-duplicates.yml
          git commit -m "Prevent duplicate blank outfits during JSON import"
          git push
