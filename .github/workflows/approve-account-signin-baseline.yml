name: Approve account sign-in visual baseline

on:
  push:
    branches: [fix/account-last-sign-in-nowrap-20260905]
    paths: [.github/workflows/approve-account-signin-baseline.yml]

permissions:
  contents: write

jobs:
  approve:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 15
    steps:
      - name: Checkout feature
        uses: actions/checkout@v7
      - name: Checkout visual baseline
        uses: actions/checkout@v7
        with:
          repository: inarin14311431/tnx-cast-archive-test
          ref: visual-regression-baseline
          path: .visual-reference
      - name: Sync visual test contract
        run: |
          rm -rf tests/visual
          cp -R .visual-reference/tests/visual tests/visual
          cp .visual-reference/playwright.visual.config.js playwright.visual.config.js
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Regenerate approved desktop account snapshots
        run: npx playwright test --config=playwright.visual.config.js --project=visual-desktop --grep 'アカウント' --update-snapshots
      - name: Update only desktop account baselines
        run: |
          desktop='tests/visual/__screenshots__/visual-desktop/operational-pages.visual.spec.js'
          cp "$desktop/account-nova-visual-desktop.png" ".visual-reference/$desktop/account-nova-visual-desktop.png"
          cp "$desktop/account-spectrum-neon-visual-desktop.png" ".visual-reference/$desktop/account-spectrum-neon-visual-desktop.png"
          cd .visual-reference
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/visual/__screenshots__/visual-desktop/operational-pages.visual.spec.js/account-nova-visual-desktop.png \
                  tests/visual/__screenshots__/visual-desktop/operational-pages.visual.spec.js/account-spectrum-neon-visual-desktop.png
          git diff --cached --quiet && exit 0
          git commit -m 'Approve account sign-in visual baseline'
          git push origin HEAD:visual-regression-baseline
