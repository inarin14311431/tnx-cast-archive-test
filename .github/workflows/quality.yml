name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  accessibility:
    name: Accessibility baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Run accessibility baseline
        run: npx playwright test --config=playwright.quality.config.js tests/quality/accessibility.spec.js
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-report
          path: playwright-report/
          retention-days: 14

  performance:
    name: Performance budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Run performance budgets
        run: npx playwright test --config=playwright.quality.config.js tests/quality/performance-budget.spec.js
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-report
          path: playwright-report/
          retention-days: 14