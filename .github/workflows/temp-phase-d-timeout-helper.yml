name: Temporary Phase D Timeout Helper

on:
  push:
    branches: [p3/phase-d-timeout-helper-20260828]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p3/phase-d-timeout-helper-20260828
          fetch-depth: 0
      - name: Apply narrow timeout refactor
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          Path('js/async-timeout.js').write_text('''export const DEFAULT_REQUEST_TIMEOUT_MS = 12000;\n\nexport function withRequestTimeout(operation, message, timeoutMs = DEFAULT_REQUEST_TIMEOUT_MS) {\n  let timer;\n  return Promise.race([\n    Promise.resolve(operation),\n    new Promise((_, reject) => {\n      timer = globalThis.setTimeout(() => reject(new Error(message)), timeoutMs);\n    })\n  ]).finally(() => globalThis.clearTimeout(timer));\n}\n''')

          replace('js/account.js', 'import { getStyleColor } from "./style-colors.js";\n\nconst REQUEST_TIMEOUT_MS = 12000;', 'import { getStyleColor } from "./style-colors.js";\nimport { withRequestTimeout } from "./async-timeout.js?v=1";')
          replace('js/account.js', '''\nfunction withRequestTimeout(operation, message, timeoutMs = REQUEST_TIMEOUT_MS) {\n  let timer;\n  return Promise.race([\n    Promise.resolve(operation),\n    new Promise((_, reject) => {\n      timer = setTimeout(() => reject(new Error(message)), timeoutMs);\n    })\n  ]).finally(() => clearTimeout(timer));\n}\n''', '\n')

          replace('js/acts-app.js', 'import { requireAuth } from "./auth-state.js?v=4";\n\nconst REQUEST_TIMEOUT_MS = 12000;', 'import { requireAuth } from "./auth-state.js?v=4";\nimport { withRequestTimeout } from "./async-timeout.js?v=1";')
          replace('js/acts-app.js', '''\nfunction withRequestTimeout(request, message, timeoutMs = REQUEST_TIMEOUT_MS) {\n  let timeoutId;\n  const timeout = new Promise((_, reject) => {\n    timeoutId = window.setTimeout(() => reject(new Error(message)), timeoutMs);\n  });\n  return Promise.race([Promise.resolve(request), timeout])\n    .finally(() => window.clearTimeout(timeoutId));\n}\n''', '\n')

          replace('js/showcase-dynamic-publish.js', 'import { supabase } from "./supabase-client.js";\n', 'import { supabase } from "./supabase-client.js";\nimport { withRequestTimeout } from "./async-timeout.js?v=1";\n')
          replace('js/showcase-dynamic-publish.js', '''const PUBLISH_TIMEOUT_MS = 12000;\nlet publishing = false;\n\nclass PublishTimeoutError extends Error {\n  constructor() {\n    super("公開結果を確認できませんでした。通信状態を確認し、ページを再読み込みして公開状態と参加履歴を確認してください。");\n    this.name = "PublishTimeoutError";\n  }\n}\n\nfunction withTimeout(operation, timeoutMs = PUBLISH_TIMEOUT_MS) {\n  let timer;\n  return Promise.race([\n    Promise.resolve(operation),\n    new Promise((_, reject) => {\n      timer = setTimeout(() => reject(new PublishTimeoutError()), timeoutMs);\n    })\n  ]).finally(() => clearTimeout(timer));\n}\n''', 'let publishing = false;\n')
          replace('js/showcase-dynamic-publish.js', 'const { data: actId, error } = await withTimeout(supabase.rpc("publish_act_showcase_for_current_user", {', 'const { data: actId, error } = await withRequestTimeout(supabase.rpc("publish_act_showcase_for_current_user", {')
          replace('js/showcase-dynamic-publish.js', '''      p_participant_ids: [...new Set(participantIds)]\n    }));''', '''      p_participant_ids: [...new Set(participantIds)]\n    }), "公開結果を確認できませんでした。通信状態を確認し、ページを再読み込みして公開状態と参加履歴を確認してください。");''')

          replace('account.html', './js/account.js?v=43', './js/account.js?v=44')
          replace('acts.html', './js/acts-app.js?v=2', './js/acts-app.js?v=3')
          replace('js/showcase-generator-loader.js', './showcase-dynamic-publish.js?v=6', './showcase-dynamic-publish.js?v=7')
          replace('showcase-generator.html', './js/showcase-generator-loader.js?v=22', './js/showcase-generator-loader.js?v=23')

          Path('tests/async-timeout-contract.test.mjs').write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport test from "node:test";\n\nconst helper = fs.readFileSync("js/async-timeout.js", "utf8");\nconst account = fs.readFileSync("js/account.js", "utf8");\nconst acts = fs.readFileSync("js/acts-app.js", "utf8");\nconst showcase = fs.readFileSync("js/showcase-dynamic-publish.js", "utf8");\n\ntest("one shared finite timeout boundary owns timer mechanics", () => {\n  assert.match(helper, /DEFAULT_REQUEST_TIMEOUT_MS = 12000/);\n  assert.match(helper, /Promise\\.race/);\n  assert.match(helper, /globalThis\\.setTimeout/);\n  assert.match(helper, /finally\\(\\(\\) => globalThis\\.clearTimeout/);\n});\n\ntest("network-heavy operational modules use the shared timeout helper", () => {\n  for (const source of [account, acts, showcase]) {\n    assert.match(source, /withRequestTimeout/);\n    assert.match(source, /async-timeout\\.js\\?v=1/);\n    assert.doesNotMatch(source, /function withRequestTimeout\\(/);\n  }\n});\n''')

          replace('tests/account-async-resilience.test.mjs', '  assert.match(app, /const REQUEST_TIMEOUT_MS = 12000/);\n  assert.match(app, /withRequestTimeout\\(/);', '  assert.match(app, /withRequestTimeout/);\n  assert.match(app, /async-timeout\\.js\\?v=1/);')

          replace('tests/acts-resilience-characterization.test.mjs', '''test("ACT requests have one finite timeout boundary", () => {\n  assert.match(app, /const REQUEST_TIMEOUT_MS = 12000/);\n  const timeout = bodyOf("withRequestTimeout");\n  assert.match(timeout, /Promise\\.race/);\n  assert.match(timeout, /window\\.setTimeout/);\n  assert.match(timeout, /window\\.clearTimeout/);\n});''', '''test("ACT requests use the shared finite timeout boundary", () => {\n  assert.match(app, /withRequestTimeout/);\n  assert.match(app, /async-timeout\\.js\\?v=1/);\n  assert.doesNotMatch(app, /function withRequestTimeout\\(/);\n});''')

          p = Path('tests/showcase-publish-resilience.test.mjs')
          text = p.read_text()
          text = text.replace('''test("showcase publishing has a finite RPC timeout boundary", () => {\n  assert.match(app, /const PUBLISH_TIMEOUT_MS = 12000/);\n  assert.match(app, /withTimeout\\(/);\n  assert.match(app, /publish_act_showcase_for_current_user/);\n});''', '''test("showcase publishing uses the shared finite RPC timeout boundary", () => {\n  assert.match(app, /withRequestTimeout/);\n  assert.match(app, /async-timeout\\.js\\?v=1/);\n  assert.match(app, /publish_act_showcase_for_current_user/);\n  assert.doesNotMatch(app, /class PublishTimeoutError/);\n});''')
          p.write_text(text)

          p = Path('tests/showcase-publish-loader-contract.test.mjs')
          text = p.read_text().replace('showcase-dynamic-publish.js?v=6', 'showcase-dynamic-publish.js?v=7')
          p.write_text(text)

          Path('.github/workflows/temp-phase-d-timeout-helper.yml').unlink()
      - name: Verify focused contracts
        run: node --test tests/async-timeout-contract.test.mjs tests/account-async-resilience.test.mjs tests/acts-resilience-characterization.test.mjs tests/showcase-publish-resilience.test.mjs tests/showcase-publish-loader-contract.test.mjs
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P3 Phase D: Share async timeout boundary"
          git push origin HEAD:p3/phase-d-timeout-helper-20260828
