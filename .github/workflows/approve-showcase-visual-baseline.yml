name: Approve showcase visual baseline

on:
  push:
    branches:
      - feat/showcase-theme-prototype

permissions:
  contents: write

jobs:
  approve-showcase-generator:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
      - name: Checkout approved visual reference
        uses: actions/checkout@v7
        with:
          repository: inarin14311431/tnx-cast-archive-test
          ref: visual-regression-baseline
          path: .visual-reference
      - name: Sync visual test contract
        run: |
          rm -rf tests/visual
          cp -R .visual-reference/tests/visual tests/visual
          cp .visual-reference/playwright.visual.config.js playwright.visual.config.js
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Regenerate only showcase generator desktop snapshots
        run: npx playwright test tests/visual/operational-pages.visual.spec.js --config=playwright.visual.config.js --project=visual-desktop --grep 'アクト紹介生成' --update-snapshots=all
      - name: Stage only the two approved generator snapshots
        shell: bash
        run: |
          set -euo pipefail
          rel='tests/visual/__screenshots__/visual-desktop/operational-pages.visual.spec.js'
          nova="$rel/showcase-generator-nova-visual-desktop.png"
          neon="$rel/showcase-generator-spectrum-neon-visual-desktop.png"
          test -f "$nova"
          test -f "$neon"
          cp "$nova" ".visual-reference/$nova"
          cp "$neon" ".visual-reference/$neon"
          cd .visual-reference
          changed="$(git status --porcelain -- "$nova" "$neon")"
          test -n "$changed"
          unexpected="$(git status --porcelain | grep -vF " $nova" | grep -vF " $neon" || true)"
          test -z "$unexpected"
          git add -- "$nova" "$neon"
      - name: Commit approved baseline
        shell: bash
        run: |
          set -euo pipefail
          cd .visual-reference
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(visual): approve PR 362 showcase theme selector baselines'
          git push origin HEAD:visual-regression-baseline
