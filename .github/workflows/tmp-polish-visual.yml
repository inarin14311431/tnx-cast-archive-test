name: Temp polish visual (remove before merge)

on:
  push:
    branches: [fix/act-showcase-polish]

jobs:
  diag:
    name: Diagnose standard desktop (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: final
            ref: ${{ github.sha }}
            reference: test/visual-act-showcase-polish
          - label: main
            ref: main
            reference: visual-regression-baseline
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.reference }}
          path: .visual-reference
      - run: |
          rm -rf tests/visual
          cp -R .visual-reference/tests/visual tests/visual
          cp .visual-reference/playwright.visual.config.js playwright.visual.config.js
          cat > playwright.visual.strict.config.js <<'CFG'
          import base from "./playwright.visual.config.js";
          export default {
            ...base,
            expect: { ...base.expect, toHaveScreenshot: { ...base.expect.toHaveScreenshot, maxDiffPixelRatio: 0, maxDiffPixels: 0, threshold: 0 } }
          };
          CFG
          cat > diag.cjs <<'JS'
          const fs = require("fs"); const path = require("path");
          const { PNG } = require("playwright-core/lib/utilsBundle");
          const walk = d => fs.existsSync(d) ? fs.readdirSync(d, { withFileTypes: true }).flatMap(e => e.isDirectory() ? walk(path.join(d, e.name)) : [path.join(d, e.name)]) : [];
          for (const actual of walk("test-results/visual").filter(f => f.endsWith("-actual.png"))) {
            const expected = actual.replace(/-actual\.png$/, "-expected.png");
            const a = PNG.sync.read(fs.readFileSync(actual)); const e = PNG.sync.read(fs.readFileSync(expected));
            if (a.width !== e.width || a.height !== e.height) { console.log("DIAG SIZE", actual, a.width, a.height, e.width, e.height); continue; }
            let count = 0, minX = 1e9, minY = 1e9, maxX = -1, maxY = -1, max = 0; const rows = new Map();
            for (let y = 0; y < a.height; y++) for (let x = 0; x < a.width; x++) {
              const i = (y * a.width + x) * 4; const d = Math.max(Math.abs(a.data[i]-e.data[i]), Math.abs(a.data[i+1]-e.data[i+1]), Math.abs(a.data[i+2]-e.data[i+2]));
              if (d) { count++; max = Math.max(max, d); minX = Math.min(minX, x); minY = Math.min(minY, y); maxX = Math.max(maxX, x); maxY = Math.max(maxY, y); const b = Math.floor(y / 100) * 100; rows.set(b, (rows.get(b) || 0) + 1); }
            }
            let lighter = 0, darker = 0, sa = [0,0,0], se = [0,0,0];
            for (let y = minY; y <= maxY; y++) for (let x = minX; x <= maxX; x++) { const i = (y * a.width + x) * 4; const la = a.data[i]+a.data[i+1]+a.data[i+2], le = e.data[i]+e.data[i+1]+e.data[i+2]; if (la > le) lighter++; else if (la < le) darker++; for (let c = 0; c < 3; c++) { sa[c] += a.data[i+c]; se[c] += e.data[i+c]; } }
            const n = Math.max(1, (maxX-minX+1)*(maxY-minY+1));
            console.log("DIAG-DETAIL", path.basename(path.dirname(actual)), `actualLighter=${lighter} actualDarker=${darker} meanActual=${sa.map(v=>Math.round(v/n))} meanExpected=${se.map(v=>Math.round(v/n))}`);
            console.log("DIAG", path.basename(path.dirname(actual)), "pixels=" + count, "maxDelta=" + max, `x=${minX}..${maxX} y=${minY}..${maxY}`, "rows:", [...rows.entries()].map(([k, v]) => `${k}:${v}`).join(" "));
          }
          JS
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install
      - name: Standard desktop nova/vlad/lutetia x15 (strict)
        continue-on-error: true
        shell: bash
        run: |
          npx playwright test --config=playwright.visual.strict.config.js --project=visual-desktop --grep "アクト紹介\(スタンダード\) (nova|vlad|lutetia)" --repeat-each=40 --reporter=list 2>&1 | grep -E "✓|✘|passed|failed" | tee /tmp/diag.log
      - name: Where the failing screenshots differ
        continue-on-error: true
        run: node diag.cjs
      - name: Standard intron desktop x5 (strict), one run each
        if: matrix.label == 'final'
        continue-on-error: true
        shell: bash
        run: |
          rm -rf test-results
          for i in 1 2 3 4 5; do npx playwright test --config=playwright.visual.strict.config.js --project=visual-desktop --grep "アクト紹介\(スタンダード\) intron" --reporter=list 2>&1 | grep -E "✓|✘|passed|failed"; done
      - name: Where the intron screenshots differ
        if: matrix.label == 'final'
        continue-on-error: true
        run: node diag.cjs
