name: Temp Update Visual Baseline

on:
  workflow_dispatch:
    inputs:
      grep:
        description: "Playwright --grep filter"
        required: true
        default: "キャスト閲覧 nova"

jobs:
  update:
    name: Regenerate reference screenshots
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 15
    steps:
      - name: Checkout branch under test
        uses: actions/checkout@v7
      - name: Checkout approved visual reference
        uses: actions/checkout@v7
        with:
          repository: inarin14311431/tnx-cast-archive-test
          ref: visual-regression-baseline
          path: .visual-reference
      - name: Sync visual test contract
        run: |
          test -f .visual-reference/playwright.visual.config.js
          test -d .visual-reference/tests/visual
          rm -rf tests/visual
          cp -R .visual-reference/tests/visual tests/visual
          cp .visual-reference/playwright.visual.config.js playwright.visual.config.js
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Update matching screenshots (desktop)
        run: npx playwright test --config=playwright.visual.config.js --project=visual-desktop --update-snapshots --grep "${{ inputs.grep }}"
      - name: Update matching screenshots (mobile)
        run: npx playwright test --config=playwright.visual.config.js --project=visual-mobile --update-snapshots --grep "${{ inputs.grep }}"
      - name: Upload updated screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: updated-visual-screenshots
          path: tests/visual/__screenshots__/
          if-no-files-found: error
          retention-days: 7
