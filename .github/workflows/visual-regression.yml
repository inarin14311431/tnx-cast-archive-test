name: Visual Regression

on:
  pull_request:
  workflow_dispatch:

jobs:
  # The compare takes about 13 minutes. A pull request that changes documents only cannot change a screenshot, so it is skipped
  # there. A job skipped by `if` is reported as skipped, which a required check treats as passed. Fail-safe: when this detection
  # job itself fails, its output is empty and the compare runs anyway.
  visual-changes:
    name: Detect changes that can alter screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Decide whether the compare has to run
        id: detect
        run: node scripts/visual-regression-needed.mjs

  compare:
    name: Compare reference screenshots
    needs: visual-changes
    if: ${{ always() && needs.visual-changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    # 30: the compare took about 9 minutes before ACT READY pattern B; its 10 shots (each walks the sequence to ACT READY) take about 8 more.
    # A timeout shows up as "cancelled", not as a failure.
    timeout-minutes: 30
    steps:
      - name: Checkout production
        uses: actions/checkout@v7
      - name: Checkout approved visual reference
        uses: actions/checkout@v7
        with:
          repository: inarin14311431/tnx-cast-archive-test
          ref: visual-regression-baseline
          path: .visual-reference
      - name: Sync visual test contract
        run: |
          test -f .visual-reference/playwright.visual.config.js
          test -d .visual-reference/tests/visual
          rm -rf tests/visual
          cp -R .visual-reference/tests/visual tests/visual
          cp .visual-reference/playwright.visual.config.js playwright.visual.config.js
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Compare screenshots
        run: npm run test:visual:production
      - name: Upload visual report and image diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-report
          path: |
            playwright-report-visual-desktop/
            playwright-report-visual-mobile/
            test-results/visual-desktop/
            test-results/visual-mobile/
          if-no-files-found: ignore
          retention-days: 14
