name: Visual Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compare:
    name: Compare reference screenshots
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Compare screenshots
        run: npm run visual

      - name: Upload visual report and image diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: |
            playwright-report-visual/
            test-results/visual/
          if-no-files-found: ignore
          retention-days: 14
