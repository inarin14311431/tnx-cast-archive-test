name: Visual Regression

on:
  pull_request:
  workflow_dispatch:

jobs:
  # The compare takes about 13 minutes. A pull request that changes documents only cannot change a screenshot, so it is skipped
  # there. A job skipped by `if` is reported as skipped, which a required check treats as passed. Fail-safe: when this detection
  # job itself fails, its output is empty and the compare runs anyway.
  visual-changes:
    name: Detect changes that can alter screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Decide whether the compare has to run
        id: detect
        run: node scripts/visual-regression-needed.mjs

  # The compare takes about 14 minutes with both projects in one job, so each project runs as its own job, in parallel.
  # The job named "Compare reference screenshots" (below) is the one the branch protection requires: it passes when the compare
  # was not needed, and otherwise only when both projects passed AND scripts/summarize-visual-shards.mjs confirms that every
  # listed test ran once and every baseline image (except the one the desktop run leaves out on purpose) was compared once.
  compare-shard:
    name: Compare screenshots (${{ matrix.project }})
    needs: visual-changes
    if: ${{ always() && needs.visual-changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    # 25: one project takes about 8 minutes; a timeout shows up as "cancelled", not as a failure
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [visual-desktop, visual-mobile]
    steps:
      - name: Checkout production
        uses: actions/checkout@v7
      - name: Checkout approved visual reference
        uses: actions/checkout@v7
        with:
          repository: inarin14311431/tnx-cast-archive-test
          ref: visual-regression-baseline
          path: .visual-reference
      - name: Sync visual test contract
        run: |
          test -f .visual-reference/playwright.visual.config.js
          test -d .visual-reference/tests/visual
          rm -rf tests/visual
          cp -R .visual-reference/tests/visual tests/visual
          cp .visual-reference/playwright.visual.config.js playwright.visual.config.js
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Compare screenshots
        run: npm run test:visual:production
        env:
          VISUAL_PROJECT: ${{ matrix.project }}
          VISUAL_COMPARE_LOG_DIR: visual-compare-logs
      - name: Upload visual report and image diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-report-${{ matrix.project }}
          path: |
            playwright-report-${{ matrix.project }}/
            test-results/${{ matrix.project }}/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the list of compared screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-compare-log-${{ matrix.project }}
          path: visual-compare-logs/${{ matrix.project }}.json
          if-no-files-found: error
          retention-days: 14

  compare:
    name: Compare reference screenshots
    needs: [visual-changes, compare-shard]
    # always(): this job decides the result of the projects, so it must run when one failed or was cancelled too
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Not needed, or both projects passed?
        env:
          NEEDED: ${{ needs.visual-changes.outputs.run }}
          SHARDS: ${{ needs.compare-shard.result }}
        run: |
          if [ "$NEEDED" = "false" ]; then echo "The compare is not needed for this change."; exit 0; fi
          if [ "$SHARDS" != "success" ]; then echo "The compare finished as '$SHARDS'."; exit 1; fi
          echo "Both projects passed."
      - name: Checkout
        if: needs.visual-changes.outputs.run != 'false'
        uses: actions/checkout@v7
      - name: Checkout approved visual reference
        if: needs.visual-changes.outputs.run != 'false'
        uses: actions/checkout@v7
        with:
          repository: inarin14311431/tnx-cast-archive-test
          ref: visual-regression-baseline
          path: .visual-reference
      - name: Sync visual test contract
        if: needs.visual-changes.outputs.run != 'false'
        run: |
          rm -rf tests/visual
          cp -R .visual-reference/tests/visual tests/visual
          cp .visual-reference/playwright.visual.config.js playwright.visual.config.js
      - name: Setup Node
        if: needs.visual-changes.outputs.run != 'false'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        if: needs.visual-changes.outputs.run != 'false'
        run: npm install
      - name: Download the compare logs
        if: needs.visual-changes.outputs.run != 'false'
        uses: actions/download-artifact@v7
        with:
          pattern: visual-compare-log-*
          path: visual-compare-logs
          merge-multiple: true
      - name: Every test ran and every baseline image was compared
        if: needs.visual-changes.outputs.run != 'false'
        run: node scripts/summarize-visual-shards.mjs visual-compare-logs
