name: Visual Regression

on:
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots_grep:
        description: "TEMPORARY: when set, regenerate (instead of compare) reference screenshots matching this --grep filter and upload them as an artifact. Leave empty for the normal compare run."
        required: false
        default: ""

jobs:
  compare:
    name: Compare reference screenshots
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 15
    steps:
      - name: Checkout production
        uses: actions/checkout@v7
      - name: Checkout approved visual reference
        uses: actions/checkout@v7
        with:
          repository: inarin14311431/tnx-cast-archive-test
          ref: visual-regression-baseline
          path: .visual-reference
      - name: Sync visual test contract
        run: |
          test -f .visual-reference/playwright.visual.config.js
          test -d .visual-reference/tests/visual
          rm -rf tests/visual
          cp -R .visual-reference/tests/visual tests/visual
          cp .visual-reference/playwright.visual.config.js playwright.visual.config.js
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Compare screenshots
        if: ${{ github.event.inputs.update_snapshots_grep == '' }}
        run: npm run test:visual:production
      - name: Regenerate screenshots (desktop)
        if: ${{ github.event.inputs.update_snapshots_grep != '' }}
        run: npx playwright test --config=playwright.visual.config.js --project=visual-desktop --update-snapshots --grep "${{ github.event.inputs.update_snapshots_grep }}"
      - name: Regenerate screenshots (mobile)
        if: ${{ github.event.inputs.update_snapshots_grep != '' }}
        run: npx playwright test --config=playwright.visual.config.js --project=visual-mobile --update-snapshots --grep "${{ github.event.inputs.update_snapshots_grep }}"
      - name: Upload regenerated screenshots
        if: ${{ always() && github.event.inputs.update_snapshots_grep != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: updated-visual-screenshots
          path: tests/visual/__screenshots__/
          if-no-files-found: error
          retention-days: 7
      - name: Upload visual report and image diffs
        if: ${{ always() && github.event.inputs.update_snapshots_grep == '' }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-report
          path: |
            playwright-report-visual-desktop/
            playwright-report-visual-mobile/
            test-results/visual-desktop/
            test-results/visual-mobile/
          if-no-files-found: ignore
          retention-days: 14
