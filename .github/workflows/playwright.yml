name: Playwright E2E

on:
  pull_request:
  workflow_dispatch:

# No workflow-level concurrency. It used to be one group for the whole workflow, so a run waited for every earlier run
# (the Act showcase job alone takes about 35 minutes). What has to be serialized is the use of the shared test-owner account
# (E2E_EMAIL), and only two jobs use it: Authenticated editor E2E and Mobile E2E. Each has its own group below, so two runs
# never use the account in the same job type at once. Do not give two jobs of the same run one group: a pending job is
# cancelled when another one joins the group, which would turn the check of an older run red.
# tests/e2e-account-concurrency.test.mjs fails when a job that is given the account has no group.

jobs:
  public-smoke:
    name: Public and smoke E2E
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run public and smoke tests
        run: npm run e2e:ci-public
        env:
          E2E_CAST_ID: ${{ secrets.E2E_CAST_ID }}
      - name: Upload public Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-public
          path: playwright-report/
          retention-days: 14

  # ACT SHOWCASE E2E is long, so it runs only for pull requests that touch the files the ACT SHOWCASE pages and
  # its specs depend on (triggerPaths of ci-act-showcase in tests/e2e/test-suites.json), and always on manual
  # dispatch. The decision is made per job here instead of with on.pull_request.paths, which would also stop
  # the other (required) jobs of this workflow. A job skipped by `if` is reported as skipped, which a required
  # check treats as passed.
  act-showcase-changes:
    name: Detect ACT SHOWCASE changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Decide whether ACT SHOWCASE E2E has to run
        id: detect
        run: node scripts/e2e-changed-groups.mjs ci-act-showcase

  # The suite takes about 35 minutes in one piece, so it runs as 3 shards (Playwright's --shard) on separate runners. The
  # shards do not share a CPU, which matters for the specs that measure animation timing. The job below, named "Act showcase E2E"
  # like before, is the one the branch protection requires: it passes when the shards were not needed, and otherwise only when
  # every shard passed AND the shards together ran exactly the tests of the suite (scripts/summarize-e2e-shards.mjs).
  act-showcase-shard:
    name: Act showcase E2E shard ${{ matrix.shard }}/3
    needs: act-showcase-changes
    if: needs.act-showcase-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # 25: one shard takes about 12 minutes; a timeout shows up as "cancelled", not as a failure
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run ACT SHOWCASE tests (shard)
        run: npm run e2e:ci-act-showcase
        env:
          E2E_SHARD: ${{ matrix.shard }}/3
          PLAYWRIGHT_JSON_OUTPUT_NAME: shard-${{ matrix.shard }}.json
      - name: Upload ACT SHOWCASE Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-act-showcase-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14
      - name: Upload the shard's JSON report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: act-showcase-json-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14

  act-showcase:
    name: Act showcase E2E
    needs: [act-showcase-changes, act-showcase-shard]
    # always(): this job decides the result of the shards, so it must run when a shard failed or was cancelled too
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Not needed, or all shards passed?
        env:
          NEEDED: ${{ needs.act-showcase-changes.outputs.run }}
          SHARDS: ${{ needs.act-showcase-shard.result }}
        run: |
          if [ "$NEEDED" = "false" ]; then echo "ACT SHOWCASE E2E is not needed for this change."; exit 0; fi
          if [ "$NEEDED" != "true" ]; then echo "The change detection did not answer ('$NEEDED'): failing to be safe."; exit 1; fi
          if [ "$SHARDS" != "success" ]; then echo "The shards finished as '$SHARDS'."; exit 1; fi
          echo "All shards passed."
      - name: Checkout
        if: needs.act-showcase-changes.outputs.run == 'true'
        uses: actions/checkout@v7
      - name: Setup Node
        if: needs.act-showcase-changes.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        if: needs.act-showcase-changes.outputs.run == 'true'
        run: npm install
      - name: Download the shards' JSON reports
        if: needs.act-showcase-changes.outputs.run == 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: act-showcase-json-*
          path: shard-reports
          merge-multiple: true
      - name: The shards ran every test of the suite, once
        if: needs.act-showcase-changes.outputs.run == 'true'
        run: node scripts/summarize-e2e-shards.mjs ci-act-showcase 3 shard-reports

  authenticated-editor:
    name: Authenticated editor E2E
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: shared-db-owner-e2e-editor
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run authenticated editor tests
        run: npm run e2e:ci-editor
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_CAST_ID: ${{ secrets.E2E_CAST_ID }}
      - name: Upload editor Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-editor
          path: playwright-report/
          retention-days: 14

  mobile:
    name: Mobile E2E
    runs-on: ubuntu-latest
    concurrency:
      group: shared-db-owner-e2e-mobile
      cancel-in-progress: false
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run mobile tests
        run: npm run e2e:ci-mobile
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_CAST_ID: ${{ secrets.E2E_CAST_ID }}
      - name: Upload mobile Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-mobile
          path: playwright-report/
          retention-days: 14
