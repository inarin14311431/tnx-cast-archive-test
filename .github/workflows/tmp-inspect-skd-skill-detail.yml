name: Temporary skill detail inspection
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect-detail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print focused source
        shell: bash
        run: |
          echo '=== sheet-master-search.js 180-380 ==='
          sed -n '180,380p' js/sheet-master-search.js
          echo '=== sheet-new-character-state.js ==='
          cat js/sheet-new-character-state.js
          echo '=== sheet-skill-renderer.js ==='
          cat js/sheet-skill-renderer.js
          echo '=== sheet.js 370-430 ==='
          sed -n '370,430p' js/sheet.js
          echo '=== master-search selection tests ==='
          cat tests/master-search-selection.test.mjs
          echo '=== renderer tests ==='
          cat tests/sheet-skill-renderer.test.mjs
