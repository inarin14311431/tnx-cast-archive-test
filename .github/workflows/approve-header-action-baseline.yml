name: Approve header action visual baseline

on:
  push:
    branches: [fix/header-action-contrast-20260905]
    paths: [.github/workflows/approve-header-action-baseline.yml]

permissions:
  contents: write

jobs:
  approve:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 15
    steps:
      - name: Checkout feature
        uses: actions/checkout@v7
      - name: Checkout visual baseline
        uses: actions/checkout@v7
        with:
          repository: inarin14311431/tnx-cast-archive-test
          ref: visual-regression-baseline
          path: .visual-reference
      - name: Sync visual test contract
        run: |
          rm -rf tests/visual
          cp -R .visual-reference/tests/visual tests/visual
          cp .visual-reference/playwright.visual.config.js playwright.visual.config.js
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Regenerate approved archive snapshots for both themes and viewports
        run: npx playwright test --config=playwright.visual.config.js --grep 'キャスト一覧' --update-snapshots
      - name: Update only the approved archive baselines
        run: |
          desktop='tests/visual/__screenshots__/visual-desktop/core-pages.visual.spec.js'
          mobile='tests/visual/__screenshots__/visual-mobile/core-pages.visual.spec.js'
          cp "$desktop/archive-nova-visual-desktop.png" ".visual-reference/$desktop/archive-nova-visual-desktop.png"
          cp "$desktop/archive-spectrum-neon-visual-desktop.png" ".visual-reference/$desktop/archive-spectrum-neon-visual-desktop.png"
          cp "$mobile/archive-nova-visual-mobile.png" ".visual-reference/$mobile/archive-nova-visual-mobile.png"
          cp "$mobile/archive-spectrum-neon-visual-mobile.png" ".visual-reference/$mobile/archive-spectrum-neon-visual-mobile.png"
          cd .visual-reference
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/visual/__screenshots__/visual-desktop/core-pages.visual.spec.js/archive-nova-visual-desktop.png \
                  tests/visual/__screenshots__/visual-desktop/core-pages.visual.spec.js/archive-spectrum-neon-visual-desktop.png \
                  tests/visual/__screenshots__/visual-mobile/core-pages.visual.spec.js/archive-nova-visual-mobile.png \
                  tests/visual/__screenshots__/visual-mobile/core-pages.visual.spec.js/archive-spectrum-neon-visual-mobile.png
          git diff --cached --quiet && exit 0
          git commit -m 'Approve header action visual baseline'
          git push origin HEAD:visual-regression-baseline
