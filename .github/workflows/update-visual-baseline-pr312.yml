name: Update PR312 visual baseline

on:
  push:
    branches:
      - fix/showcase-cinematic-layout-20260909

permissions:
  actions: read
  contents: write

jobs:
  update:
    name: Approve two showcase-generator desktop baselines
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout visual baseline
        uses: actions/checkout@v7
        with:
          repository: inarin14311431/tnx-cast-archive-test
          ref: visual-regression-baseline
          path: baseline
          fetch-depth: 0

      - name: Download PR 312 visual report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34319990313 \
            --repo inarin14311431/tnx-cast-archive-test \
            --name visual-regression-report \
            --dir report

      - name: Verify approved actual screenshots
        shell: bash
        run: |
          set -euo pipefail
          nova='report/test-results/visual/operational-pages.visual-アクト紹介生成-nova-visual-desktop/showcase-generator-nova-visual-desktop-actual.png'
          neon='report/test-results/visual/operational-pages.visual-アクト紹介生成-spectrum-neon-visual-desktop/showcase-generator-spectrum-neon-visual-desktop-actual.png'
          test -f "$nova"
          test -f "$neon"
          nova_hash="$(sha256sum "$nova" | awk '{print $1}')"
          neon_hash="$(sha256sum "$neon" | awk '{print $1}')"
          test "$nova_hash" = 'ba449cb3d73038710f525ce0b66973b0611064fc1b9d8be7d148a17b1938932'
          test "$neon_hash" = '5b7bb043000b47295f8ca0ae906ceae3b0216dfdc7dd75a134622edb56422405'

      - name: Replace only the two approved baseline images
        shell: bash
        run: |
          set -euo pipefail
          target='baseline/tests/visual/__screenshots__/visual-desktop/operational-pages.visual.spec.js'
          cp 'report/test-results/visual/operational-pages.visual-アクト紹介生成-nova-visual-desktop/showcase-generator-nova-visual-desktop-actual.png' \
             "$target/showcase-generator-nova-visual-desktop.png"
          cp 'report/test-results/visual/operational-pages.visual-アクト紹介生成-spectrum-neon-visual-desktop/showcase-generator-spectrum-neon-visual-desktop-actual.png' \
             "$target/showcase-generator-spectrum-neon-visual-desktop.png"
          git -C baseline status --short
          changed="$(git -C baseline diff --name-only | sort)"
          expected="$(printf '%s\n%s\n' \
            'tests/visual/__screenshots__/visual-desktop/operational-pages.visual.spec.js/showcase-generator-nova-visual-desktop.png' \
            'tests/visual/__screenshots__/visual-desktop/operational-pages.visual.spec.js/showcase-generator-spectrum-neon-visual-desktop.png' | sort)"
          test "$changed" = "$expected"

      - name: Commit approved visual baseline
        shell: bash
        run: |
          set -euo pipefail
          git -C baseline config user.name 'github-actions[bot]'
          git -C baseline config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C baseline add \
            tests/visual/__screenshots__/visual-desktop/operational-pages.visual.spec.js/showcase-generator-nova-visual-desktop.png \
            tests/visual/__screenshots__/visual-desktop/operational-pages.visual.spec.js/showcase-generator-spectrum-neon-visual-desktop.png
          git -C baseline commit -m 'chore(visual): approve PR 312 showcase generator baselines'
          git -C baseline push origin HEAD:visual-regression-baseline
