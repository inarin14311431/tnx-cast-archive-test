name: One-shot normalize shared module versions

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  normalize:
    if: github.head_ref == 'maintenance/shared-module-version-unify-20260911' && github.actor == 'inarin14311431'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: maintenance/shared-module-version-unify-20260911
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Normalize exact shared-module cache references
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const edits = [
            ['js/sheet-new-character-state.js', './sheet-row-collection-state.js', './sheet-row-collection-state.js?v=2'],
            ['js/character-sheet-jsonp-canonical.js', './outfit-ofc-adapter.js?v=1', './outfit-ofc-adapter.js?v=2'],
            ['js/sheet-import-outfit-compat.js', './outfit-ofc-adapter.js?v=1', './outfit-ofc-adapter.js?v=2'],
            ['js/outfit-ofc-adapter.js', './outfit-contract.js', './outfit-contract.js?v=3'],
            ['js/outfit-pc-field-policy.js', './outfit-contract.js?v=2', './outfit-contract.js?v=3'],
            ['js/outfit-view-model.js', './outfit-contract.js', './outfit-contract.js?v=3'],
            ['js/outfit-view-model.js', './outfit-legacy-compat.js', './outfit-legacy-compat.js?v=1'],
            ['js/sheet-mobile-outfit-model.js', './outfit-contract.js', './outfit-contract.js?v=3'],
            ['js/sheet-mobile-outfit-model.js', './outfit-legacy-compat.js', './outfit-legacy-compat.js?v=1'],
            ['js/outfit-ofc-utils.js', './outfit-legacy-compat.js', './outfit-legacy-compat.js?v=1']
          ];

          for (const [file, from, to] of edits) {
            let source = await readFile(file, 'utf8');
            const occurrences = source.split(from).length - 1;
            if (occurrences !== 1) {
              throw new Error(`${file}: expected exactly one occurrence of ${from}, found ${occurrences}`);
            }
            source = source.replace(from, to);
            await writeFile(file, source, 'utf8');
            console.log(`${file}: ${from} -> ${to}`);
          }
          NODE
      - name: Verify targeted cache policy
        run: npm run audit:cache
      - name: Commit normalized references
        run: |
          if git diff --quiet; then
            echo 'No normalization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/sheet-new-character-state.js js/character-sheet-jsonp-canonical.js js/sheet-import-outfit-compat.js js/outfit-ofc-adapter.js js/outfit-pc-field-policy.js js/outfit-view-model.js js/sheet-mobile-outfit-model.js js/outfit-ofc-utils.js
          git commit -m 'PC／モバイル共有モジュールversionを統一'
          git push origin HEAD:maintenance/shared-module-version-unify-20260911
