name: Apply generic use count labels

on:
  push:
    branches:
      - fix/generic-use-count-label-20260914

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/generic-use-count-label-20260914
      - name: Replace act-specific visible labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "sheet.html": [
                  ("1アクト使用上限 * <small>USES / ACT</small>", "使用回数 * <small>USES</small>"),
                  ("1アクト使用上限 <small>USES / ACT</small>", "使用回数 <small>USES</small>"),
                  ("判定用コンボと、1アクトの使用回数を追う技能カウンターをここから管理できます。", "判定用コンボと、使用回数を追う技能カウンターをここから管理できます。"),
              ],
              "js/cast.js": [
                  ("1アクト使用回数 <small>ACT USES</small>", "使用回数 <small>USES</small>"),
              ],
              "js/cast-mobile.js": [
                  ('limit?["使用上限",`${limit}回/ACT`]:null', 'limit?["使用回数",`${limit}回`]:null'),
                  ("使用回数　${limit}回/ACT", "使用回数　${limit}回"),
              ],
              "cast.html": [
                  ("./js/cast.js?v=95", "./js/cast.js?v=96"),
                  ("./js/cast-mobile.js?v=5", "./js/cast-mobile.js?v=6"),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count < 1:
                      raise SystemExit(f"expected text not found in {filename}: {old}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/apply-generic-use-count-label.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sheet.html cast.html js/cast.js js/cast-mobile.js .github/workflows/apply-generic-use-count-label.yml
          git commit -m "使用回数表記をアクト非依存へ変更"
          git push origin HEAD:fix/generic-use-count-label-20260914
