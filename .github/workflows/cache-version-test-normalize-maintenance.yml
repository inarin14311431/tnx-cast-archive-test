name: Cache version test normalize maintenance

on:
  push:
    branches:
      - maintenance/cache-version-unify-20260911

permissions:
  contents: write

jobs:
  normalize-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v7
        with:
          ref: maintenance/cache-version-unify-20260911
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Normalize editor cache versions
        run: npm run normalize:editor-cache
      - name: Commit normalized contract tests
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No normalization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "test: normalize editor cache version expectations"
          git push origin HEAD:maintenance/cache-version-unify-20260911
