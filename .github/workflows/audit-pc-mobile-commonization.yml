name: Audit PC Mobile Commonization

on:
  push:
    branches:
      - audit/pc-mobile-commonization
    paths:
      - 'tools/audit-pc-mobile-commonization.mjs'
      - '.github/workflows/audit-pc-mobile-commonization.yml'
      - 'js/**'
      - '*.html'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: npm run check:js

      - name: Audit module dependency graph
        run: npm run audit:modules

      - name: Audit runtime integrity
        run: npm run audit:integrity

      - name: Audit PC editor runtime
        run: npm run audit:sheet

      - name: Audit mobile editor runtime
        run: npm run audit:mobile

      - name: Run Node regression tests
        run: npm test

      - name: Generate audit report
        run: node tools/audit-pc-mobile-commonization.mjs

      - name: Commit generated report
        run: |
          if [ -z "$(git status --porcelain -- audit/pc-mobile-commonization-report.md)" ]; then
            echo 'No report changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+inarin14311431@users.noreply.github.com'
          git add audit/pc-mobile-commonization-report.md
          git commit -m 'docs(audit): generate PC/mobile commonization report [skip ci]'
          git push
