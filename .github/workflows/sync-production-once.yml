name: Prepare exact production baseline

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-production-once.yml

permissions:
  contents: write

jobs:
  prepare-production-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create exact production snapshot branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add production https://github.com/inarin14311431/tnx_cast_list.git
          git fetch --no-tags production main
          git switch -C sync/exact-production-tree-20260831
          git rm -r --ignore-unmatch .
          git checkout production/main -- .
          git commit -m "Align verification environment with production baseline"
          git push --force origin HEAD:sync/exact-production-tree-20260831
