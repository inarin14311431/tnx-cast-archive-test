name: Finalize mobile counter
on:
  push:
    paths:
      - '.github/workflows/finalize-mobile-counter.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and refresh cache
        run: |
          node --check js/cast-mobile-combos.js
          sed -i 's/cast-mobile-combos.css?v=1/cast-mobile-combos.css?v=2/g' cast.html
          sed -i 's/cast-mobile-combos.js?v=1/cast-mobile-combos.js?v=2/g' cast.html
      - name: Commit cache bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cast.html
          git commit -m 'Refresh mobile counter assets' || exit 0
          git push
