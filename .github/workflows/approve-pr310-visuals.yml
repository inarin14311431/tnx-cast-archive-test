name: Approve PR 310 visual baselines

on:
  push:
    branches:
      - fix/showcase-delete-backgrounds-20260909
    paths:
      - .github/workflows/approve-pr310-visuals.yml

permissions:
  contents: write

jobs:
  approve:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
      - name: Checkout approved visual reference
        uses: actions/checkout@v7
        with:
          repository: inarin14311431/tnx-cast-archive-test
          ref: visual-regression-baseline
          path: .visual-reference
      - name: Sync visual test contract
        run: |
          test -f .visual-reference/playwright.visual.config.js
          test -d .visual-reference/tests/visual
          rm -rf tests/visual
          cp -R .visual-reference/tests/visual tests/visual
          cp .visual-reference/playwright.visual.config.js playwright.visual.config.js
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Update only ACT SHOWCASE generator desktop snapshots
        run: >-
          npx playwright test tests/visual/operational-pages.visual.spec.js
          --config=playwright.visual.config.js
          --project=visual-desktop
          --grep 'アクト紹介生成 (nova|spectrum-neon)'
          --update-snapshots
      - name: Copy only approved snapshots to reference branch
        run: |
          SNAPSHOT_DIR='tests/visual/__screenshots__/visual-desktop/operational-pages.visual.spec.js'
          REF_DIR='.visual-reference/tests/visual/__screenshots__/visual-desktop/operational-pages.visual.spec.js'
          test -f "$SNAPSHOT_DIR/showcase-generator-nova-visual-desktop.png"
          test -f "$SNAPSHOT_DIR/showcase-generator-spectrum-neon-visual-desktop.png"
          cp "$SNAPSHOT_DIR/showcase-generator-nova-visual-desktop.png" "$REF_DIR/showcase-generator-nova-visual-desktop.png"
          cp "$SNAPSHOT_DIR/showcase-generator-spectrum-neon-visual-desktop.png" "$REF_DIR/showcase-generator-spectrum-neon-visual-desktop.png"
      - name: Commit approved reference images
        working-directory: .visual-reference
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/visual/__screenshots__/visual-desktop/operational-pages.visual.spec.js/showcase-generator-nova-visual-desktop.png tests/visual/__screenshots__/visual-desktop/operational-pages.visual.spec.js/showcase-generator-spectrum-neon-visual-desktop.png
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --name-only | grep -Fx 'tests/visual/__screenshots__/visual-desktop/operational-pages.visual.spec.js/showcase-generator-nova-visual-desktop.png'
          git diff --cached --name-only | grep -Fx 'tests/visual/__screenshots__/visual-desktop/operational-pages.visual.spec.js/showcase-generator-spectrum-neon-visual-desktop.png'
          git commit -m 'chore(visual): approve PR 310 showcase management baselines'
          git push origin HEAD:visual-regression-baseline
