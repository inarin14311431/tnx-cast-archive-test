<!doctype html>
<html lang="ja">
<head>
  <script src="./js/css-next-theme.js"></script>
  <link rel="stylesheet" href="./css-next/index.css?v=56" data-css-system="next">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>キャラシ倉庫 直接転記通信試験 // N◎VA ARCHIVE TEST</title>
  <style>
    body{min-height:100vh;padding:32px;background:var(--color-bg);color:var(--color-text)}
    .prototype{width:min(820px,100%);margin:0 auto;padding:24px;border:1px solid var(--color-border);background:var(--color-surface)}
    .prototype h1{margin-top:0;color:var(--color-accent)}
    .prototype .warning{padding:12px 14px;border-left:3px solid var(--color-accent);background:var(--color-accent-soft);line-height:1.7}
    .prototype label{display:grid;gap:8px;margin:18px 0;font-weight:700}
    .prototype input{width:100%;min-width:0;padding:12px}
    .prototype button{min-height:44px;padding:10px 16px}
    .prototype pre{white-space:pre-wrap;word-break:break-word;min-height:110px;padding:14px;border:1px solid var(--color-border-muted);background:var(--color-bg)}
    .prototype .status[data-state="success"]{color:var(--color-success)}
    .prototype .status[data-state="error"]{color:var(--color-danger,#ff6b6b)}
    .prototype small{color:var(--color-muted)}
  </style>
</head>
<body data-page="transfer-direct-prototype.html">
  <main class="prototype">
    <h1>キャラシ倉庫 直接転記通信試験</h1>
    <p class="warning"><strong>安全試験モード：</strong>このページはキャラシ倉庫へ登録・更新を行いません。既に存在するキャラクターを読み取るGET通信だけで、通常のfetchがCORS上許可されるか確認します。</p>
    <label>キャラクターシート倉庫URL
      <input id="source-url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://character-sheets.appspot.com/tnx/edit.html?key=...">
    </label>
    <button id="run-test" type="button">CORS読取試験 <small>SAFE GET ONLY</small></button>
    <p id="status" class="status" aria-live="polite">未実行。POSTは実装されていません。</p>
    <pre id="result">ここに診断結果を表示します。</pre>
  </main>
  <script src="./js/transfer-direct-prototype.js?v=1"></script>
</body>
</html>
