<!doctype html>
<html lang="ja">
<head>
  <script src="./js/css-next-theme.js?v=3"></script>
  <link rel="stylesheet" href="./css-next/index.css?v=58" data-css-system="next">
  <link rel="stylesheet" href="./css-next/pages/simple-guest-generator.css?v=1">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>簡易ゲスト化 // N◎VA CAST ARCHIVE</title>
</head>
<body data-page="guest-generator.html">
  <div class="background-grid"></div>
  <div class="scanlines"></div>

  <header class="guest-generator-header app-header">
    <a id="guest-generator-back" class="app-back-link" href="./index.html">
      <span>&lt; キャストへ戻る</span>
      <small>RETURN TO CAST</small>
    </a>
    <p>N◎VA MUNICIPAL DATABASE</p>
    <h1>簡易ゲスト化 <small>SIMPLE GUEST DATA / POC</small></h1>
  </header>

  <main class="guest-generator-layout">
    <section class="guest-generator-intro">
      <p class="guest-generator-kicker">CAST → GUEST CONVERSION</p>
      <h2 id="guest-generator-title">キャストデータを読み込み中…</h2>
      <p>元のキャストを変更せず、ルーラーが参照しやすい項目だけを抽出します。数値の再計算や自動強化は行いません。</p>
    </section>

    <section id="guest-generator-output" class="guest-generator-output" hidden>
      <header class="guest-generator-output__header">
        <div>
          <p id="guest-generator-id" class="guest-generator-kicker"></p>
          <h2 id="guest-name"></h2>
          <p id="guest-styles" class="guest-styles"></p>
        </div>
        <button id="guest-copy" type="button"><span>簡易ゲストデータをコピー</span><small>COPY TEXT</small></button>
      </header>

      <section class="guest-block guest-block--ability">
        <h3>能力値／制御値 <small>ABILITY / CONTROL</small></h3>
        <div id="guest-abilities" class="guest-ability-grid"></div>
      </section>

      <section class="guest-block">
        <h3>主要技能 <small>KEY SKILLS</small></h3>
        <div id="guest-skills" class="guest-list"></div>
      </section>

      <section class="guest-block">
        <h3>スタイル技能 <small>STYLE SKILLS</small></h3>
        <div id="guest-style-skills" class="guest-list"></div>
      </section>

      <section class="guest-block">
        <h3>戦闘装備 <small>COMBAT OUTFITS</small></h3>
        <div id="guest-weapons" class="guest-list"></div>
        <div id="guest-armor" class="guest-armor-total"></div>
      </section>

      <section class="guest-block">
        <h3>ルーラー用メモ <small>RULER NOTES</small></h3>
        <textarea id="guest-text" readonly rows="14"></textarea>
      </section>
    </section>

    <section id="guest-generator-error" class="guest-generator-error" hidden></section>
  </main>

  <script type="module" src="./js/simple-guest-generator.js?v=1"></script>
</body>
</html>
