<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAST SUMMON // TNX ARCHIVE</title>
<style>
:root{color-scheme:dark;font-family:"Noto Sans JP",system-ui,sans-serif;background:#030712;color:#e9f5ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 20%,#15314b 0%,#060b18 52%,#02030a 100%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 4px,#72eaff08 5px 6px);z-index:10}
main{max-width:1080px;margin:auto;padding:48px 20px 80px;text-align:center}header small{letter-spacing:.42em;color:#71d9ed}h1{font-size:clamp(30px,6vw,65px);letter-spacing:.13em;margin:10px 0;text-shadow:0 0 28px #24d8ff88}header p{color:#91a8bf}
.rates{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:26px 0;color:#b9c8db;font-size:12px}.rates span{border:1px solid #37556b;padding:7px 12px;background:#0a1b2c}
button{cursor:pointer;border:1px solid #5fe8ff;background:linear-gradient(100deg,#104c68,#122f53);color:white;padding:16px 48px;letter-spacing:.25em;font-weight:800;box-shadow:0 0 24px #14cfff55}button:disabled{opacity:.45;cursor:wait}button:focus-visible{outline:3px solid #fff;outline-offset:4px}
#status{min-height:26px;color:#a7c2d5;margin:22px 0}#stage{perspective:1100px;min-height:570px;display:grid;place-items:center}
.card{--glow:#61dfff;position:relative;width:min(360px,90vw);min-height:540px;border:2px solid var(--glow);border-radius:14px;overflow:hidden;background:linear-gradient(155deg,#152b44,#060b19 65%);box-shadow:0 0 20px var(--glow),0 0 90px #1ba6ef33;animation:appear 1.1s cubic-bezier(.2,.7,.2,1) both}
.card[data-rarity="3"]{--glow:#64cfff}.card[data-rarity="4"]{--glow:#bd8dff}.card[data-rarity="5"]{--glow:#ffcc67}
@keyframes appear{0%{opacity:0;transform:rotateY(85deg) scale(.55);filter:brightness(4)}65%{filter:brightness(2)}100%{opacity:1;transform:rotateY(0) scale(1);filter:brightness(1)}}
.arcana{position:absolute;inset:8px;border:1px solid #c3d6ef50;display:flex;flex-direction:column;justify-content:space-between;align-items:center;opacity:.20;pointer-events:none;overflow:hidden}.arcana:before{content:"";position:absolute;width:260px;height:260px;top:115px;border:3px double #e3f5ff;border-radius:50%;box-shadow:0 0 0 25px #e3f5ff12,0 0 0 53px #e3f5ff0b}.arcana strong{font-family:serif;font-size:95px}.arcana em{font-family:serif;font-size:24px;letter-spacing:.2em;writing-mode:vertical-rl}
.art{height:260px;position:relative;display:grid;place-items:center;overflow:hidden}.art img{width:100%;height:100%;object-fit:contain;position:relative;z-index:1;filter:drop-shadow(0 5px 20px #0009)}.art .empty{font-size:80px;color:#bce9ff44}.content{position:relative;z-index:2;padding:8px 20px 22px;background:linear-gradient(transparent,#030814 8%,#030814ef)}
.stars{color:var(--glow);font-size:24px;letter-spacing:4px;text-shadow:0 0 12px var(--glow)}.handle{color:var(--glow);font-size:13px;margin:5px 0}.name{font-size:25px;margin:4px 0 10px;overflow-wrap:anywhere}.styles{font-size:12px;color:#b9cfe0;min-height:22px}.quote{font-size:12px;line-height:1.6;min-height:38px;margin:12px 0;color:#f1e7d1}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.stats div{border-top:1px solid #6b8a9d;padding-top:7px;font-size:11px;color:#94b4c8}.stats b{display:block;color:white;font-size:21px}.exp{font-size:11px;color:#9cb9cb;margin-top:13px}
#again{margin-top:20px}footer{font-size:11px;color:#7892a7;margin-top:40px} @media(prefers-reduced-motion:reduce){.card{animation:none}}
</style></head><body><main>
<header><small>TNX CAST ARCHIVE / EXPERIMENTAL TRANSMISSION</small><h1>CAST SUMMON</h1><p>ニューロエイジの邂逅。公開キャストから一枚を召喚する。</p></header>
<div class="rates" aria-label="排出率"><span>★★ 50%</span><span>★★★ 30%</span><span>★★★★ 15%</span><span>★★★★★ 5%</span></div>
<button id="draw" type="button" disabled>INITIALIZING</button><p id="status" role="status" aria-live="polite">公開キャストを照合中…</p>
<section id="stage" aria-label="召喚結果"></section><button id="again" type="button" hidden>SUMMON AGAIN</button>
<footer>非公式ファンツール / 結果は保存されません。公開キャストのみを使用します。</footer>
</main><script type="module" src="./js/cast-gacha.js?v=1"></script></body></html>
